<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Reset hasła</title>
</head>
<body style="font-family: Arial; background:#f5f5f5; padding:20px;">
<div style="max-width:600px; background:white; padding:20px; margin:auto; border-radius:8px;">
    <h2>Reset hasła</h2>

    <p>Otrzymaliśmy prośbę o zresetowanie hasła.</p>
    <p>Jeśli to Ty, kliknij poniżej:</p>

    <a href="${resetLink}"
       style="display:inline-block; padding:10px 20px; background:#007bff;
       color:white; text-decoration:none; border-radius:5px;">
        Zresetuj hasło
    </a>

    <p style="margin-top:20px; font-size:12px; color:#777;">
        Link jest ważny 30 minut.
    </p>
</div>
</body>
</html>
