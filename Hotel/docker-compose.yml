services:
  postgres:
    image: postgres:17
    container_name: hotel-postgres
    environment:
      POSTGRES_DB: HotelDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0000
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  hotel:
    image: hotel:0.0.1-SNAPSHOT
    container_name: hotel-backend
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/HotelDB
      DB_USERNAME: postgres
      DB_PASSWORD: 0000

      MAIL_USERNAME: mwbookingapplication@gmail.com
      MAIL_PASSWORD: xnefiujuvnmfludl
    depends_on:
      - postgres

volumes:
  postgres_data: